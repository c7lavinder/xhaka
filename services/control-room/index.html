<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xhaka Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --card: #111827;
    --border: #1e293b;
    --accent: #10b981;
    --accent-dim: #065f46;
    --text: #f1f5f9;
    --muted: #64748b;
    --red: #ef4444;
    --amber: #f59e0b;
    --green: #10b981;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--accent);
  }

  header span {
    font-size: 12px;
    color: var(--muted);
  }

  #last-updated {
    font-size: 11px;
    color: var(--muted);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    overflow: hidden;
  }

  .card.wide { grid-column: 1 / -1; }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--accent-dim);
    color: var(--accent);
  }

  .badge.red { background: #450a0a; color: var(--red); }
  .badge.amber { background: #451a03; color: var(--amber); }

  /* Status dot */
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.red { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .dot.amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .dot.gray { background: var(--muted); }

  /* Agent cards */
  .agents-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }

  .agent-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .agent-card .agent-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .agent-name {
    font-weight: 600;
    font-size: 13px;
  }

  .agent-role {
    font-size: 11px;
    color: var(--muted);
  }

  /* Jobs table */
  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 7px 10px;
    border-bottom: 1px solid #0f172a;
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #0f172a; }

  .job-name {
    font-weight: 500;
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }

  .status-pill.success { background: #052e16; color: var(--green); }
  .status-pill.fail { background: #450a0a; color: var(--red); }
  .status-pill.running { background: #451a03; color: var(--amber); }
  .status-pill.unknown { background: #1e293b; color: var(--muted); }

  /* Commits */
  .commit-list { display: flex; flex-direction: column; gap: 8px; }

  .commit-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 8px;
    background: var(--bg);
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  .commit-sha {
    font-family: monospace;
    font-size: 11px;
    color: var(--accent);
    white-space: nowrap;
    background: var(--accent-dim);
    padding: 2px 6px;
    border-radius: 4px;
  }

  .commit-msg {
    font-size: 13px;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .commit-time {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* Stats row */
  .stats-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .stat-box {
    flex: 1;
    min-width: 100px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }

  .stat-num {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.1;
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Tool tiers */
  .tier-section { margin-bottom: 14px; }
  .tier-section:last-child { margin-bottom: 0; }

  .tier-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }

  .tier-label.live { color: var(--green); }
  .tier-label.notwired { color: var(--muted); }
  .tier-label.explore { color: var(--amber); }

  .tool-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid;
  }

  .chip.live {
    background: #052e16;
    color: var(--green);
    border-color: var(--accent-dim);
  }

  .chip.notwired {
    background: #0f172a;
    color: var(--muted);
    border-color: var(--border);
  }

  .chip.explore {
    background: #451a03;
    color: var(--amber);
    border-color: #78350f;
  }

  /* Queue big number */
  .queue-display {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .queue-num {
    font-size: 48px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .queue-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .queue-meta span {
    font-size: 12px;
    color: var(--muted);
  }

  .loading {
    color: var(--muted);
    font-size: 12px;
    padding: 10px 0;
    text-align: center;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .error-msg {
    color: var(--red);
    font-size: 12px;
    padding: 8px;
    background: #450a0a22;
    border-radius: 6px;
    border: 1px solid #450a0a;
  }

  @media (max-width: 640px) {
    .grid { padding: 12px; gap: 12px; }
    header { padding: 14px 16px; }
    .queue-num { font-size: 36px; }
  }
</style>
</head>
<body>

<header>
  <h1>🧠 Xhaka Control Room</h1>
  <nav style="display:flex;align-items:center;gap:16px;">
    <a href="simulation.html" style="font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;padding:4px 12px;border-radius:6px;background:var(--accent-dim);border:1px solid var(--accent-dim);">Simulation</a>
    <span id="last-updated">Loading...</span>
  </nav>
</header>

<div class="grid">

  <!-- Queue Depth -->
  <div class="card" id="card-queue">
    <div class="card-header">
      <span class="card-title">Task Queue</span>
      <span class="badge" id="queue-badge">—</span>
    </div>
    <div class="queue-display">
      <div class="queue-num" id="queue-depth">—</div>
      <div class="queue-meta">
        <span id="queue-detail">Fetching...</span>
      </div>
    </div>
  </div>

  <!-- Knowledge Stats -->
  <div class="card" id="card-knowledge">
    <div class="card-header">
      <span class="card-title">Knowledge Base</span>
    </div>
    <div class="stats-row" id="knowledge-stats">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <!-- Agents -->
  <div class="card wide">
    <div class="card-header">
      <span class="card-title">Agent Roster</span>
      <span class="badge">6 Active</span>
    </div>
    <div class="agents-grid" id="agents-grid"></div>
  </div>

  <!-- Job Results -->
  <div class="card wide">
    <div class="card-header">
      <span class="card-title">Last 10 Job Results</span>
      <span class="badge" id="jobs-badge">—</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Job</th>
            <th>Status</th>
            <th>Agent</th>
            <th>Duration</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody id="jobs-body">
          <tr><td colspan="5" class="loading">Loading job results...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Recent Commits -->
  <div class="card wide">
    <div class="card-header">
      <span class="card-title">Recent Commits</span>
      <span class="badge" id="commits-badge">—</span>
    </div>
    <div class="commit-list" id="commits-list">
      <div class="loading">Loading commits...</div>
    </div>
  </div>

  <!-- Tool Tiers -->
  <div class="card wide">
    <div class="card-header">
      <span class="card-title">Tool Status</span>
    </div>
    <div class="tier-section">
      <div class="tier-label live">● LIVE</div>
      <div class="tool-chips" id="tools-live"></div>
    </div>
    <div class="tier-section">
      <div class="tier-label notwired">○ NOT WIRED</div>
      <div class="tool-chips" id="tools-notwired"></div>
    </div>
    <div class="tier-section">
      <div class="tier-label explore">◎ EXPLORE</div>
      <div class="tool-chips" id="tools-explore"></div>
    </div>
  </div>

</div>

<script>
const TOKEN = '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';
const REPO = 'c7lavinder/xhaka';
const API = 'https://api.github.com';

const AGENTS = [
  { name: 'Xhaka',      role: 'COO / Strategy',     emoji: '🧠' },
  { name: 'Builder',    role: 'Engineering',         emoji: '👷' },
  { name: 'Auditor',    role: 'QA & Compliance',     emoji: '👮' },
  { name: 'Researcher', role: 'Intelligence & R&D',  emoji: '🔬' },
  { name: 'Architect',  role: 'Visuals & Dashboard', emoji: '🎨' },
  { name: 'Librarian',  role: 'Memory & Knowledge',  emoji: '📚' },
];

const TOOLS = {
  live:     ['Railway','GitHub','OpenAI','Telegram','GHL','BatchDialer','BatchLeads','CallRail'],
  notwired: ['Sentry','PostHog','LangSmith','Supabase'],
  explore:  ['Cognee','OpenViking','GitNexus','Superpowers','gstack','Paperclip','Hindsight'],
};

// Helpers
async function ghFetch(path) {
  const res = await fetch(`${API}${path}`, {
    headers: { Authorization: `token ${TOKEN}`, Accept: 'application/vnd.github.v3+json' },
  });
  if (!res.ok) throw new Error(`GitHub ${res.status}: ${path}`);
  return res.json();
}

async function ghRaw(path) {
  const res = await fetch(`${API}${path}`, {
    headers: { Authorization: `token ${TOKEN}`, Accept: 'application/vnd.github.v3.raw' },
  });
  if (!res.ok) throw new Error(`GitHub ${res.status}: ${path}`);
  return res.text();
}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

function statusPill(status) {
  const s = (status || '').toLowerCase();
  if (s === 'success' || s === 'ok' || s === 'done' || s === 'pass') return `<span class="status-pill success"><span class="dot green"></span>success</span>`;
  if (s === 'fail' || s === 'error' || s === 'failed') return `<span class="status-pill fail"><span class="dot red"></span>fail</span>`;
  if (s === 'running' || s === 'active' || s === 'pending') return `<span class="status-pill running"><span class="dot amber"></span>running</span>`;
  return `<span class="status-pill unknown">${status || '—'}</span>`;
}

// Render agents (static)
function renderAgents() {
  const grid = document.getElementById('agents-grid');
  grid.innerHTML = AGENTS.map(a => `
    <div class="agent-card">
      <div class="agent-top">
        <span class="dot green"></span>
        <span>${a.emoji}</span>
        <span class="agent-name">${a.name}</span>
      </div>
      <div class="agent-role">${a.role}</div>
    </div>
  `).join('');
}

// Render tool tiers (static)
function renderTools() {
  for (const [tier, tools] of Object.entries(TOOLS)) {
    const el = document.getElementById(`tools-${tier}`);
    const dot = tier === 'live' ? '●' : tier === 'notwired' ? '○' : '◎';
    el.innerHTML = tools.map(t => `<span class="chip ${tier}">${dot} ${t}</span>`).join('');
  }
}

// Load queue
async function loadQueue() {
  try {
    const raw = await ghRaw(`/repos/${REPO}/contents/data/task-queue.json`);
    const data = JSON.parse(raw);
    const tasks = Array.isArray(data) ? data : (data.tasks || data.queue || []);
    const depth = tasks.length;
    document.getElementById('queue-depth').textContent = depth;
    document.getElementById('queue-badge').textContent = `${depth} tasks`;
    const badge = document.getElementById('queue-badge');
    if (depth === 0) { badge.className = 'badge'; }
    else if (depth < 5) { badge.className = 'badge'; }
    else { badge.className = 'badge amber'; }
    document.getElementById('queue-detail').innerHTML = depth === 0
      ? '<span style="color:var(--green)">Queue empty</span>'
      : `<span style="color:var(--amber)">${depth} pending task${depth !== 1 ? 's' : ''}</span>`;
  } catch (e) {
    document.getElementById('queue-depth').textContent = '?';
    document.getElementById('queue-detail').innerHTML = `<span style="color:var(--muted)">Unavailable</span>`;
  }
}

// Load knowledge stats
async function loadKnowledge() {
  const el = document.getElementById('knowledge-stats');
  const stats = [];

  const tryCount = async (label, path) => {
    try {
      const data = await ghFetch(`/repos/${REPO}/contents/${path}`);
      const count = Array.isArray(data) ? data.length : 1;
      return { label, count };
    } catch {
      return { label, count: '?' };
    }
  };

  const [books, sim, inbox] = await Promise.all([
    tryCount('Books', 'memory/context/books'),
    tryCount('Sim Contexts', 'memory/context/sim'),
    tryCount('Repo Inbox', 'intelligence/repo-inbox.md'),
  ]);

  el.innerHTML = [books, sim, inbox].map(s => `
    <div class="stat-box">
      <div class="stat-num">${s.count}</div>
      <div class="stat-label">${s.label}</div>
    </div>
  `).join('');
}

// Load job results
async function loadJobs() {
  const tbody = document.getElementById('jobs-body');
  try {
    const raw = await ghRaw(`/repos/${REPO}/contents/data/results.tsv`);
    const lines = raw.trim().split('\n').filter(Boolean);
    // Try to detect header row
    let dataLines = lines;
    if (lines.length && lines[0].toLowerCase().includes('job') || lines[0].toLowerCase().includes('status') || lines[0].toLowerCase().includes('name')) {
      dataLines = lines.slice(1);
    }
    const last10 = dataLines.slice(-10).reverse();

    document.getElementById('jobs-badge').textContent = `${dataLines.length} total`;

    if (last10.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted);text-align:center;padding:16px;">No job results found</td></tr>';
      return;
    }

    tbody.innerHTML = last10.map(line => {
      const cols = line.split('\t');
      // Flexible column mapping — try common patterns
      // Assume: job, status, agent, duration, timestamp (or subset)
      const [c0, c1, c2, c3, c4] = cols;
      const job = c0 || '—';
      const status = c1 || '—';
      const agent = c2 || '—';
      const duration = c3 || '—';
      const ts = c4 || '';
      const tsDisplay = ts ? `<span title="${ts}">${timeAgo(ts)}</span>` : '—';
      return `<tr>
        <td><span class="job-name" title="${job}">${job}</span></td>
        <td>${statusPill(status)}</td>
        <td>${agent}</td>
        <td>${duration}</td>
        <td>${tsDisplay}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="error-msg">Could not load results.tsv — ${e.message}</div></td></tr>`;
  }
}

// Load commits
async function loadCommits() {
  const el = document.getElementById('commits-list');
  try {
    const data = await ghFetch(`/repos/${REPO}/commits?per_page=5`);
    document.getElementById('commits-badge').textContent = `${data.length} shown`;
    el.innerHTML = data.map(c => {
      const sha = c.sha.slice(0, 7);
      const msg = c.commit.message.split('\n')[0];
      const ts = c.commit.committer.date;
      const author = c.commit.author.name;
      return `<div class="commit-item">
        <span class="commit-sha">${sha}</span>
        <span class="commit-msg" title="${msg}">${msg}</span>
        <span class="commit-time" title="${author}">${timeAgo(ts)}</span>
      </div>`;
    }).join('');
  } catch (e) {
    el.innerHTML = `<div class="error-msg">Could not load commits — ${e.message}</div>`;
  }
}

// Init
function updateTimestamp() {
  document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

async function init() {
  renderAgents();
  renderTools();
  await Promise.all([loadQueue(), loadKnowledge(), loadJobs(), loadCommits()]);
  updateTimestamp();
}

init();

// Auto-refresh every 60 seconds
setInterval(init, 60000);
</script>
</body>
</html>
